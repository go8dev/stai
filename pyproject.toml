[project]
name = "stai"
version = "0.1.0"
description = "STAI (SmartTrader AI): personal, paper-trading-only crypto research and portfolio platform."
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "ccxt==4.5.93",
    "fastapi==0.163.1",
    "freqtrade==2026.10",
    "httpx==0.28.1",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pyjwt[crypto]==2.15.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.9",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
# Checks only. Left out of the published machine by `uv sync --frozen --no-dev`.
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["artifacts/api-server"]
extend-exclude = [
    "stai_handoff",
    "node_modules",
    ".pythonlibs",
    "generated-artifacts",
    # Directories written by the platform.
    ".agents",
    ".cache",
    ".config",
    ".conversation",
    ".local",
    ".upm",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "T20"]
ignore = [
    "B008",  # FastAPI dependencies are declared as call defaults by design
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use made-up credentials, and build SQL only from text written in the test.
"artifacts/api-server/tests/**" = ["S101", "S105", "S106", "S608"]
# Ported from Smart Trader by copying (see docs/UPSTREAM_REGISTER.md). Kept close to the
# source so it can be compared with stai_handoff/: correctness rules only, no restyling.
"artifacts/api-server/stai/analytics/**" = ["E501", "F401", "I", "UP", "B", "S", "DTZ", "W"]
"artifacts/api-server/tests/analytics/**" = ["E501", "E731", "E741", "F401", "I", "UP", "B", "S", "DTZ", "W"]
"artifacts/api-server/migrations/versions/**" = ["E501"]

[tool.ruff.format]
exclude = [
    "artifacts/api-server/stai/analytics/**",
    "artifacts/api-server/tests/analytics/**",
]

[tool.pytest.ini_options]
testpaths = ["artifacts/api-server/tests"]
pythonpath = ["artifacts/api-server"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = [
    # Every warning fails the run, so a deprecation is dealt with when it first appears.
    "error",
    # Starlette 1.10 prefers httpx2 for its test client. STAI pins httpx, which the test
    # client still accepts. See docs/UPSTREAM_REGISTER.md.
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.uv]
# The backend is run from artifacts/api-server; this file only manages dependencies.
package = false
environments = ["sys_platform == 'linux'"]
# Versions resolved on 17 Nov 2026 for the Phase 1 backend together with
# freqtrade==2026.10 and TradingAgents v0.7.1 (neither is installed in Phase 1).
# Keeping them as constraints lets Phases 2 and 3 add the two engines without

# Generated from the Python backend by `pnpm run openapi:export`.
# Do not edit by hand: change the routes or schemas in artifacts/api-server/stai,
# then export again and run `pnpm --filter @workspace/api-spec run codegen`.
openapi: 3.1.0
info:
  title: Api
  description: STAI API contract. Generated from the Python backend; do not edit by hand.
  version: 0.1.0
servers:
- url: /api
  description: Base API path
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Health check
      description: Says only that the process is serving. It never touches the database.
      operationId: healthCheck
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /system/status:
    get:
      tags:
      - system
      summary: Live checks of the backend, database, market-data reachability and build
      operationId: getSystemStatus
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/user:
    get:
      tags:
      - Auth
      summary: Get the currently signed-in owner, if any
      operationId: getCurrentAuthUser
      responses:
        '200':
          description: Auth state resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags:
      - Auth
      summary: Start the browser sign-in flow
      operationId: beginBrowserLogin
      responses:
        '302':
          description: Redirect to the identity provider.
      parameters:
      - name: returnTo
        in: query
        required: false
        description: Path inside the app to open after sign-in. Anything else is ignored.
        schema:
          type: string
  /callback:
    get:
      tags:
      - Auth
      summary: Complete the browser sign-in flow
      operationId: handleBrowserLoginCallback
      responses:
        '302':
          description: Redirect back into the app.
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: iss
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
  /logout:
    get:
      tags:
      - Auth
      summary: End the session and sign out
      operationId: logoutBrowserSession
      responses:
        '302':
          description: Redirect to the identity provider's sign-out page.
        '429':
          description: Too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/csrf:
    get:
      tags:
      - Auth
      summary: Get the CSRF token for the current session
      operationId: getCsrfToken
      responses:
        '200':
          description: Token for the X-CSRF-Token header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audit/events:
    get:
      tags:
      - audit
      summary: Most recent audit events, newest first
      operationId: listAuditEvents
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      responses:
        '200':
          description: Recent events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The limit is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audit/verify:
    post:
      tags:
      - audit
      summary: Recompute the hash chain and report the first break, if any
      operationId: verifyAuditTrail
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /market/scanner:
    get:
      tags:
      - market-data
      summary: Latest public OKX spot and futures scanner data
      operationId: getMarketScanner
      responses:
        '200':
          description: Public observations with freshness and instrument rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketScannerResponse'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /portfolio/summary:
    get:
      tags:
      - portfolio
      summary: Virtual fund balances and ledger status
      operationId: getPortfolioSummary
      responses:
        '200':
          description: Persisted virtual fund balances and engine state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /portfolio/ledger:
    get:
      tags:
      - portfolio
      summary: Most recent virtual-fund ledger entries
      operationId: listPortfolioLedger
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      responses:
        '200':
          description: Recent immutable accounting events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerList'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The limit is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /portfolio/ledger/verify:
    get:
      tags:
      - portfolio
      summary: Verify the complete virtual-fund ledger chain
      operationId: verifyPortfolioLedger
      responses:
        '200':
          description: Database-only hash-chain verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerVerification'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /committee:
    get:
      tags:
      - committee
      summary: Get Committee Overview
      operationId: getCommitteeOverview
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeOverview'
        '401':
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /committee/{run_id}:
    get:
      tags:
      - committee
      summary: Get Committee Run
      operationId: getCommitteeRun
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeRunDetail'
        '401':
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
  /proposal-center:
    get:
      tags:
      - proposals
      summary: Get qualified candidates and owner-facing paper proposals
      operationId: getProposalCenter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalCenterOverview'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /proposals/{proposal_id}/approve:
    post:
      tags:
      - proposals
      summary: Approve exact proposal terms for paper mode
      operationId: approveTradeProposal
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalDecision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Same-origin CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Proposal was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Proposal failed a final safety check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Fresh market data is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request could not be validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /proposals/{proposal_id}/reject:
    post:
      tags:
      - proposals
      summary: Reject a paper trade proposal
      operationId: rejectTradeProposal
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalDecision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Same-origin CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Proposal was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Proposal is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request could not be validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /strategy-lab:
    get:
      tags:
      - strategy-lab
      summary: Get the approved strategy setup and recent historical backtests
      operationId: getStrategyLabOverview
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyLabOverview'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /strategy-lab/structural:
    get:
      tags:
      - strategy-lab
      summary: Get the isolated structural pullback research setup
      operationId: getStructuralChallengerOverview
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuralLabOverview'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /strategy-lab/structural/backtests:
    get:
      tags:
      - strategy-lab
      summary: List saved structural pullback research runs
      operationId: listStructuralChallengerBacktests
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StructuralRunListItem'
                type: array
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - strategy-lab
      summary: Run the isolated structural pullback historical challenger
      operationId: createStructuralChallengerBacktest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructuralBacktestInput'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuralBacktestResult'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Same-origin CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The future validation window is locked or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Research inputs are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Historical OKX data is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /strategy-lab/structural/backtests/{run_id}:
    get:
      tags:
      - strategy-lab
      summary: Get one saved structural pullback research run
      operationId: getStructuralChallengerBacktest
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuralBacktestResult'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Research run was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid run identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /strategy-lab/backtests:
    get:
      tags:
      - strategy-lab
      summary: List recent owner Strategy Laboratory runs
      operationId: listStrategyBacktests
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BacktestListItem'
                type: array
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - strategy-lab
      summary: Run and save a deterministic OKX historical backtest
      operationId: createStrategyBacktest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestInput'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResult'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Same-origin CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Backtest inputs are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Historical OKX data is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /strategy-lab/backtests/{run_id}:
    get:
      tags:
      - strategy-lab
      summary: Get one saved historical Strategy Laboratory run
      operationId: getStrategyBacktest
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResult'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Backtest was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Backtest identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /strategy-lab/backtests/{run_id}/reviews:
    get:
      tags:
      - strategy-lab
      summary: List completed historical AI reviews for one saved run
      operationId: listStrategyBacktestReviews
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricalReviewResponse'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Backtest was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Backtest identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - strategy-lab
      summary: Ask an authorized AI model about one immutable historical run
      operationId: createStrategyBacktestReview
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalReviewInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalReviewResponse'
        '401':
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Same-origin CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Backtest was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Historical AI review is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Question or saved evidence is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The configured review budget is exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The provider did not return a usable review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AllocationBalance:
      properties:
        marketType:
          type: string
          enum:
          - spot
          - futures
        initialBalance:
          anyOf:
          - type: number
          - type: string
        balance:
          anyOf:
          - type: number
          - type: string
        collateral:
          anyOf:
          - type: number
          - type: string
        availableBalance:
          anyOf:
          - type: number
          - type: string
        exposure:
          anyOf:
          - type: number
          - type: string
      type: object
      required:
      - marketType
      - initialBalance
      - balance
      - collateral
      - availableBalance
      - exposure
    AuditBreak:
      properties:
        seq:
          type: integer
        reason:
          $ref: '#/components/schemas/AuditBreakReason'
        detail:
          type: string
      type: object
      required:
      - seq
      - reason
      - detail
    AuditBreakReason:
      type: string
      enum:
      - sequence_gap
      - prev_hash_mismatch
      - hash_mismatch
    AuditEvent:
      properties:
        seq:
          type: integer
        occurredAt:
          type: string
          format: date-time
        eventType:
          type: string
        actorType:
          type: string
        actorId:
          anyOf:
          - type: string
          - type: 'null'
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
        payload:
          description: The payload as stored. An object for every record the application wrote; anything
            else means the record was changed in the database.
        hash:
          type: string
      type: object
      required:
      - seq
      - occurredAt
      - eventType
      - actorType
      - actorId
      - correlationId
      - payload
      - hash
    AuditEventList:
      properties:
        events:
          items:
            $ref: '#/components/schemas/AuditEvent'
          type: array
        total:
          type: integer
      type: object
      required:
      - events
      - total
    AuditSummary:
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        eventCount:
          type: integer
        lastEventAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        lastEventType:
          anyOf:
          - type: string
          - type: 'null'
        detail:
          anyOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - status
      - eventCount
      - lastEventAt
      - lastEventType
      - detail
    AuditVerification:
      properties:
        ok:
          type: boolean
        eventsChecked:
          type: integer
        firstSeq:
          anyOf:
          - type: integer
          - type: 'null'
        lastSeq:
          anyOf:
          - type: integer
          - type: 'null'
        headHash:
          anyOf:
          - type: string
          - type: 'null'
        firstBreak:
          anyOf:
          - $ref: '#/components/schemas/AuditBreak'
          - type: 'null'
        verifiedAt:
          type: string
          format: date-time
        durationMs:
          type: number
      type: object
      required:
      - ok
      - eventsChecked
      - firstSeq
      - lastSeq
      - headHash
      - firstBreak
      - verifiedAt
      - durationMs
    AuthUser:
      properties:
        id:
          type: string
        username:
          anyOf:
          - type: string
          - type: 'null'
        firstName:
          anyOf:
          - type: string
          - type: 'null'
        lastName:
          anyOf:
          - type: string
          - type: 'null'
        profileImageUrl:
          anyOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - id
      - username
      - firstName
      - lastName
      - profileImageUrl
    AuthUserEnvelope:
      properties:
        user:
          anyOf:
          - $ref: '#/components/schemas/AuthUser'
          - type: 'null'
      type: object
      required:
      - user
    BackendCheck:
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        environment:
          $ref: '#/components/schemas/RuntimeEnvironment'
        uptimeSeconds:
          type: integer
        pythonVersion:
          type: string
      type: object
      required:
      - status
      - environment
      - uptimeSeconds
      - pythonVersion
    BacktestEntryOrder:
      properties:
        signalAt:
          type: string
          format: date-time
        side:
          type: string
          enum:
          - long
          - short
        limitPrice:
          anyOf:
          - type: number
          - type: string
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - filled
          - unfilled
          - cancelled
        filledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        fillPrice:
          anyOf:
          - type: number

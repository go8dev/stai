# Alembic configuration for the STAI backend.
#
# Migrations run in development only (pnpm run db:migrate). The published database gets
# its structure from Replit's Publish step; see docs/DATABASE.md.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC
path_separator = os

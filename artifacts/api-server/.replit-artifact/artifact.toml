kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]

[services.development.run]
# STAI backend (Python, FastAPI). Commands run from the repository root.
args = ["python", "-m", "stai", "--reload"]

[services.development.run.env]
PORT = "8080"
STAI_ENV = "development"
PYTHONPATH = "artifacts/api-server"

[services.production]

[services.production.build]
# Installs exactly the locked runtime dependencies; the checks-only group is left out.
args = ["uv", "sync", "--frozen", "--no-dev"]

[services.production.run]
args = ["python", "-m", "stai"]

[services.production.run.env]
PORT = "8080"
STAI_ENV = "production"
PYTHONPATH = "artifacts/api-server"

[services.production.health.startup]
path = "/api/healthz"
